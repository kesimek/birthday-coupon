<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<title>Ellie's Birthday Adventure</title></head><body>
<header><img class="corner left" src="assets/puppy-left.svg"><img class="corner right" src="assets/puppy-right.svg">
<h1>Happy 8th Birthday, Ellie!</h1><img class="rainbow" src="assets/rainbow.svg"></header>
<section id="giftScreen" class="active"><div id="gift">🎁</div><p>Tap the gift to unlock your Birthday Adventure!</p></section>
<section id="choiceScreen" class="hidden"><div id="banner"></div>
<div class="card" id="shop"><img src="assets/shopping-icon.svg"><h2>$30 Shopping Spree</h2><button id="shopBtn" onclick="choose('shop')">Choose Adventure</button><span id="shopRibbon" class="rib">✓ Selected</span></div>
<div class="card" id="craft"><img src="assets/craft-icon.svg"><h2>Create Something Together</h2><button id="craftBtn" onclick="choose('craft')">Choose Adventure</button><span id="craftRibbon" class="rib">✓ Selected</span></div>
</section>
<section id="doneScreen" class="hidden"><h2 id="sel"></h2><button onclick="backView()">Back to Overview</button></section>
<script src="script.js"></script></body></html>
